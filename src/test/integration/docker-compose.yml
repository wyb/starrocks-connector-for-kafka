# Integration smoke environment for the StarRocks CDC source connector.
#
# Two services only. Kafka Connect is NOT a service: smoke.sh runs
# connect-standalone inside the kafka container, mounting the shaded plugin
# jar from ../../../target.
#
# Override images from the environment, e.g.
#   STARROCKS_IMAGE=my-registry/celerdata-allin1:4.2 ./smoke.sh
services:
  starrocks:
    image: ${STARROCKS_IMAGE:-starrocks/allin1-ubuntu:latest}
    hostname: starrocks
    environment:
      # Shared-data (cloud-native) mode is required: CHANGES and bookmarks
      # only exist for cloud-native tables.
      RUN_MODE: shared_data
    ports:
      - "9030:9030"
      - "8030:8030"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'select 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.7.0}
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: smoke-cluster-00000000
    volumes:
      # The shaded plugin jar. Worker/connector configs are placed at /tmp by
      # smoke.sh via `docker compose cp`.
      - ../../../target:/plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
