# Connector config for the integration smoke run.
# Key names and defaults mirror StarRocksCdcSourceConfig.
name=sr-cdc-smoke
connector.class=com.starrocks.connector.kafka.source.StarRocksCdcSourceConnector
tasks.max=1

starrocks.jdbc.url=jdbc:mysql://starrocks:9030
starrocks.database.name=smoke
starrocks.username=root
starrocks.password=
starrocks.table.names=orders

source.topic.prefix=sr
source.poll.interval.ms=2000

key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false
# Connect's Decimal logical type -- which LARGEINT rides -- is base64 bytes by default.
value.converter.decimal.format=NUMERIC
